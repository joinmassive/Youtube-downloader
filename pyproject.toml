[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "video-jobs"
version = "0.1.0"
description = "Provider-neutral, asynchronous video download jobs."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
youtube = ["yt-dlp[default]>=2026.10.26"]
s3 = ["boto3>=1.34"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
video-jobs-api = "video_jobs.api:run"
video-jobs-worker = "video_jobs.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/video_jobs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
